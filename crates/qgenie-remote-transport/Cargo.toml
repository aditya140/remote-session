[package]
name = "qgenie-remote-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["local-ipc"]
elapsed-clock = ["dep:libc", "dep:mach2"]
local-ipc = ["dep:tokio", "dep:fs2", "dep:libc", "dep:serde_json"]
ws = ["dep:tokio", "dep:futures-util", "dep:tokio-tungstenite", "dep:serde_json"]
client-ws = ["ws", "dep:tokio-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:rustls-pemfile", "dep:url", "dep:base64", "dep:ipnet", "dep:percent-encoding"]
server-ws = ["ws"]

[dependencies]
qgenie-remote-proto = { path = "../qgenie-remote-proto" }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
url = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
serde_json.workspace = true

[lints]
workspace = true
