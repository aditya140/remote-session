[package]
name = "qgenie-remote-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["pty"]
pty = ["dep:portable-pty", "dep:libc", "dep:vt100"]
codex = ["dep:tokio", "dep:serde_json", "dep:thiserror", "dep:url", "dep:libc", "dep:futures-util", "dep:tokio-tungstenite", "dep:sha2"]

[dependencies]
qgenie-remote-proto = { path = "../qgenie-remote-proto" }
portable-pty = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
anyhow.workspace = true
vt100 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
url = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[example]]
name = "terminal_checkpoint"
required-features = ["pty"]
