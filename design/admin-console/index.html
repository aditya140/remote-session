<script>
const $=s=>document.querySelector(s);let theme='workspace',persona='admin',page='Overview',filter='All',action='';
const navs={admin:['Overview','Fleet','Audit & investigations','Policies','System health'],user:['Work inbox','My machines','Session history','Launch profiles']};

const stats=(items)=>`<div class="stats">${items.map(([l,v,s])=>`<div class="stat"><label>${l}</label><strong>${v}</strong><small>${s}</small></div>`).join('')}</div>`;
const chart=()=>`<div class="chart"><svg viewBox="0 0 600 110" preserveAspectRatio="none" aria-label="Synthetic connection trend"><defs><linearGradient id="fade" x2="0" y2="1"><stop stop-color="currentColor" stop-opacity=".15"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><g stroke="var(--line)" stroke-dasharray="3 5"><path d="M0 20H600M0 60H600M0 100H600"/></g><path d="M0 89L30 82L60 85L90 60L120 68L150 50L180 57L210 38L240 48L270 50L300 29L330 39L360 31L390 42L420 23L450 30L480 17L510 30L540 24L570 13L600 20V110H0Z" fill="url(#fade)"/><path d="M0 89L30 82L60 85L90 60L120 68L150 50L180 57L210 38L240 48L270 50L300 29L330 39L360 31L390 42L420 23L450 30L480 17L510 30L540 24L570 13L600 20" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg></div><div class="chartlabels"><span>09:00</span><span>10:00</span><span>11:00</span><span>12:00</span><span>13:00</span></div>`;
const row=(icon,title,sub,right='')=>`<div class="row searchable"><div class="icon">${icon}</div><div class="grow"><h3>${title}</h3><div class="subtle">${sub}</div></div>${right}</div>`;
const timeline=()=>`<div class="pad timeline"><article><h3>Machine access revoked</h3><p>Sam Rivera · build-linux-07</p>${chip('Propagation pending','warn')}<p>13:42:16 UTC · req_demo_081</p></article><article><h3>Investigation opened</h3><p>Alex Lee · Case INC-204</p><p>13:38:02 UTC · Reason recorded</p></article><article><h3>Controller transferred</h3><p>Alex Lee · codex / API review</p><p>13:31:44 UTC · Explicit takeover</p></article></div>`;
const alertside=()=>`<div class="stack">${card('Needs attention',`<div class="pad"><div class="callout"><h3>Recording gap detected</h3><p>build-linux-07 · 13:39–13:40 UTC</p>${button('Inspect recording health','health')}</div><div class="callout"><h3>Revocation is propagating</h3><p>Committed. Cross-node evidence is pending.</p>${chip('Pending ≠ complete','warn')}</div></div>`,chip('2','warn'))}${card('Recent activity',timeline())}</div>`;
const fleet=()=>`<div class="filter">${['All','Attention','Offline'].map(x=>`<button data-filter="${x}" class="${filter===x?'active':''}">${x}</button>`).join('')}</div><div class="scroll"><table><thead><tr><th>Machine / owner</th><th>Native work</th><th>Recording</th><th>Access</th></tr></thead><tbody>${[['build-linux-07','Sam Rivera','6 sessions','Gap reported','Review'],['dev-macbook','Alex Lee','3 sessions','Observed healthy','Enabled'],['gpu-workstation','Morgan Chen','Unknown · stale','Unknown','Offline']].filter(x=>filter==='All'||(filter==='Attention'?x[0]==='build-linux-07':x[4]==='Offline')).map(x=>`<tr class="searchable"><td><b>${x[0]}</b><small>${x[1]}</small></td><td>${x[2]}</td><td>${chip(x[3],x[3].includes('Gap')?'warn':x[3]==='Unknown'?'neutral':'')}</td><td>${x[4]==='Review'?button('Review access','revoke'):chip(x[4],x[4]==='Offline'?'neutral':'')}</td></tr>`).join('')}</tbody></table></div>`;
function adminOverview(){return heading('Platform overview','Keep work moving. Keep access clear.','A focused view of fleet health, recording, and access.')+stats([['Connected machines','24 / 26','2 machines have stale presence'],['Live native sessions','86','Latest reported inventory'],['Recording warnings','2','1 gap · 1 backlog'],['Revocation propagation','1 pending','Committed · awaiting evidence']])+`<div class="grid"><div class="stack">${card('Connected machines',chart(),chip('Last 4 hours','neutral'))}${card('Fleet at a glance',fleet(),'<span class="subtle">Sample inventory</span>')}</div>${alertside()}</div>`;}
function health(){return heading('Operations / sampled 8 seconds ago','Every signal has a source.','Gateway, recording, and identity health. Native state may be stale.',button('View recording signals','signals'))+stats([['Ready gateways','4 / 4','Readiness · 8 seconds ago'],['Replay latency · p95','82 ms','Synthetic · 5-minute window'],['Oldest upload backlog','3m 12s','Connector observation'],['Directory verification','Degraded','1 source is stale']])+card('Gateway fleet',`<div class="nodes">${[1,2,3,4].map((n)=>`<div class="node"><div class="eyebrow">gateway-0${n}</div><strong>${20+n*3} ms</strong>${chip('Ready')}<p class="subtle">${n*183} active sockets</p></div>`).join('')}</div>`,chip('Routing available'))+`<div class="two" style="margin-top:20px">${card('Incident queue',row('!','Recording backlog rising','build-linux-07 · 3 minutes',chip('Investigate','warn'))+row('↻','Directory verification stale','Remote access denied for affected scope',chip('Fail closed','warn'))+row('✓','Replication recovered','PostgreSQL commit authority available',chip('Resolved')))}${card('Replay response time',chart(),chip('5-minute buckets','neutral'))}</div><div class="note" style="margin-top:20px">Observation coverage: 24 of 26 machines are current. Unknown native work is excluded from live totals.</div>`;}
function audit(){return heading('Governance / investigation workspace','A clear chain of evidence.','Inspect access decisions and recording history with a stated purpose.',button('Place legal hold','hold','primary'))+`<div class="casegrid">${card('Investigations',`<button class="caseitem active" data-action="case">INC-204<br><b>Unexpected remote access</b><p>Sam Rivera · Open</p></button><button class="caseitem" data-action="case">INC-197<br><b>Recording continuity</b><p>Platform operations · Open</p></button><div class="pad subtle">Sample case labels are local context. Durable case management is a later option.</div>`)}<div class="stack">${card('INC-204 · Unexpected remote access',`<div class="pad"><div class="two"><div><div class="eyebrow">Subject</div><h1 style="font-size:24px">Sam Rivera</h1><p>Machine: build-linux-07</p></div><div><div class="eyebrow">Access status</div><p>${chip('Revocation pending','warn')}</p><p>Committed 13:42 UTC</p></div></div><div class="note" style="margin:14px 0">Transcript content stays closed until an authorized admin states a reason. Each page read is audited.</div>${button('Request recording access','history','primary')} ${button('Review remote access','revoke')}</div>`)}${card('Audit trail',timeline(),chip('Immutable event IDs','neutral'))}</div></div>`;}
function policies(){return heading('Governance / policies','Make the boundary explicit.','Proposed policy editor. Host-side checks remain authoritative.')+card('Effective organization policy',`<div class="pad"><div class="eyebrow">Draft · revision 12</div><h1 style="font-size:23px">Developer access baseline</h1><p>Scope: engineering · Allowed agents: Codex</p><div class="two" style="margin:20px 0"><div class="note">Recording: always enabled<br>Retention cutoff: 90 days<br>Monthly rounding may retain about 120 days.</div><div class="note">Policy delivery: pending implementation<br>Host allowed roots stay locally enforced.</div></div>${button('Preview policy changes','policy','primary')}</div>`);}
function inbox(){return heading('Your workspace','Good afternoon, Alex.','Your sessions, exact task outcomes, and the decisions waiting for you.',button('Choose launch profile','launch','primary'))+stats([['Active sessions','3','Native processes are running'],['Needs your decision','1','Approval permission required'],['Completed turns','2','Exact receipt identities'],['Recording coverage','1 warning','A gap remains explicit']])+`<div class="grid"><div class="stack tasks">${card('Your work',row('↗','Review gateway changes','Codex · dev-macbook · turn_demo_41',chip('Turn running'))+row('✓','Run integration tests','Terminal · build-linux-07 · exited 0',chip('Completed'))+row('!','Investigate retry behavior','Codex · dev-macbook · turn_demo_38',chip('Turn failed','bad')))}${card('Session detail',`<div class="pad"><div class="eyebrow">Review gateway changes</div><h2>Observation and control are separate.</h2><p>Process running · Task running · You are observing</p><div class="terminal">13:42:08  Tool completed: read gateway routes<br>13:42:11  Turn running: turn_demo_41<br>13:42:16  Waiting for an explicit decision</div><div style="margin-top:16px">${button('Observe session','observe')} ${button('Request control','control')}</div></div>`)}</div><div class="stack">${card('Approval needed',`<div class="pad"><div class="eyebrow">Codex · dev-macbook</div><h1 style="font-size:23px">Run the test suite?</h1><p><code>cargo test -p gateway</code></p><p class="subtle">Approval applies to this request only. Session control does not grant approval rights.</p><div style="margin-top:20px">${button('Review request','approve','primary')}</div></div>`,chip('1 pending','warn'))}${card('Recording notice',`<div class="pad"><h3>Some output is unavailable</h3><p>build-linux-07 · A captured gap remains visible in your history.</p>${button('Open my history','ownhistory')}</div>`)}</div></div>`;}
function userPage(){if(page==='Work inbox')return inbox();if(page==='My machines')return heading('Your workspace','Your machines','Only machines enrolled to your identity appear here.')+card('Enrolled machines',row('⌘','dev-macbook','Online · 3 native sessions',chip('Connected'))+row('▣','build-linux-07','Online · recording warning',button('Revoke my machine access','revoke')));if(page==='Launch profiles')return heading('Your workspace','Start with a familiar setup.','Existing private CLI profiles stay on your machine. Cloud-synced profiles are a later option.')+card('Preview profiles',row('↗','API review','Codex · dev-macbook · ~/work/api',button('Preview launch','launch'))+row('▣','Integration tests','Terminal · build-linux-07 · ~/work/tests',button('Preview launch','launch')));return heading('Your workspace','Your session history','Your recordings, original lifetimes, and explicit gaps.')+card('Recorded sessions',row('✓','Integration tests','Today · 12:58 UTC · Exited 0',button('Read my recording','ownhistory'))+row('!','Gateway debug','Today · 12:41 UTC · Explicit output gap',chip('Incomplete','warn')));}
function render(){document.body.dataset.theme=theme;document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme));document.querySelectorAll('[data-persona]').forEach(b=>b.classList.toggle('active',b.dataset.persona===persona));$('#nav-label').textContent=persona==='admin'?'Platform administration':'Personal workspace';$('#role').textContent=persona==='admin'?'Platform admin':'Session owner';$('#crumb').textContent=(persona==='admin'?'Platform':'My workspace')+' / '+page;$('#nav').innerHTML=navs[persona].map(x=>`<button data-page="${x}" class="${page===x?'active':''}">${x}</button>`).join('');$('#content').innerHTML=(persona==='user'?userPage():page==='System health'?health():page==='Audit & investigations'?audit():page==='Policies'?policies():page==='Fleet'?heading('Platform / inventory','Fleet visibility, with clear scope.','Inventory is metadata. Recording content requires separate audited access.')+card('Machines',fleet()):adminOverview())+`<div class="bottom"><span>Sample data · Coverage and timestamps are illustrative</span><span>${persona==='admin'?'Privileged actions are audited':'Your access is scoped to your own work'}</span></div>`;}
function notify(message){$('#toast').textContent=message;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),5000);}
function openAction(kind){action=kind;if(kind==='health'){page='System health';render();return}if(kind==='ownhistory'){page='Session history';render();return}if(kind==='case'){notify('Concept: selected investigation context. No case record was saved.');return}const forms={revoke:['Revoke remote access','Sample target: build-linux-07. Local native sessions keep running. A real result must distinguish committed access denial from completed propagation.'],history:['Open protected recording','State the investigation reason. A real request must commit its audit event before returning content.'],hold:['Place a legal hold','Platform admin only. A hold preserves eligible records for this subject and is invisible to the affected user. One admin may authorize it.'],policy:['Preview policy changes','Proposed diff: minimum CLI version 0.1 → 0.2. A real save needs revision checks, audit, and delivery status.'],approve:['Review approval request','Sample tool: cargo test -p gateway. A real choice requires independent approval rights and one winning decision.'],control:['Request session control','Explicit control request. Existing lease authority determines whether input or resize is permitted.'],launch:['Preview session launch','Proposed browser launch. Persist the original start key before sending. Reconcile an unknown result with that same key.'],observe:['Observe session','Preview only. Production observation reuses the existing gateway WSS capability and replay protocol.'],signals:['Inspect recording signals','Sample signals: backlog 3m 12s, one explicit gap. Raw scrape endpoints stay private.']};const f=forms[kind]||forms.observe;$('#dialog-title').textContent=f[0];$('#dialog-copy').textContent=f[1];$('#reason').value='';$('#reason').required=['revoke','history','hold','policy'].includes(kind);$('#reason-label').textContent=kind==='approve'?'Optional decision note':'Reason';$('#confirmation').value='';$('#confirmation').required=kind==='revoke';$('#confirmation').pattern=kind==='revoke'?'REVOKE':'.*';$('#confirmation').classList.toggle('hide',kind!=='revoke');$('#confirmation-label').classList.toggle('hide',kind!=='revoke');$('#action-dialog').showModal();}

function deviceTable(devices,owner=false){return `<div class="scroll"><table><thead><tr><th>Device / type</th><th>Connection</th><th>Sessions</th><th>Last connected</th><th>Last seen</th><th></th></tr></thead><tbody>${devices.map(d=>{const rs=deviceRuns(d.id);return `<tr class="searchable"><td><b>${d.name}</b><small>${d.kind} · ${d.os}</small></td><td>${chip(d.online?'Connected':'Offline',d.online?'':'neutral')}</td><td><b>${freshRuns(rs).length} confirmed running</b><small>${rs.filter(r=>['Unknown','Stop unknown'].includes(runState(r))).length} unknown · ${rs.filter(r=>r.harness!=='PTY shell'&&runState(r)==='Running').length} agents</small></td><td>${d.lastConnected}</td><td><time datetime="${d.seenAt}">${d.lastSeen}</time></td><td><button data-device="${d.id}">View sessions</button></td></tr>`}).join('')}</tbody></table></div>`;}
function userTable(){return `<div class="scroll"><table><thead><tr><th>User</th><th>Devices / connected</th><th>Servers</th><th>Active sessions</th><th>Last seen</th></tr></thead><tbody>${inventoryUsers.map(u=>{const ds=ownedDevices(u.id),rs=userRuns(u.id),last=ds.reduce((a,b)=>Date.parse(a.seenAt)>Date.parse(b.seenAt)?a:b);return `<tr class="searchable"><td>${userButton(u)}</td><td><b>${ds.length} enrolled / ${ds.filter(d=>d.online).length} connected</b></td><td><b>${ds.filter(d=>d.kind==='Server').length} enrolled</b><small>${ds.filter(d=>d.kind==='Server'&&d.online).length} connected</small></td><td><b>${freshRuns(rs).length} confirmed running</b><small>${rs.filter(r=>['Unknown','Stop unknown'].includes(runState(r))).length} unknown</small></td><td>${last.lastSeen}</td></tr>`}).join('')}</tbody></table></div>`;}
function inventoryTotals(devices,runs){return metrics([['Enrolled devices',String(devices.length),String(devices.filter(d=>d.online).length)+' connected','Offline devices remain visible'],['Enrolled servers',String(devices.filter(d=>d.kind==='Server').length),'',String(devices.filter(d=>d.kind==='Server'&&d.online).length)+' connected · server is a device type'],['Active native sessions',String(freshRuns(runs).length),'',String(runs.filter(r=>['Unknown','Stop unknown'].includes(runState(r))||unknownStops.has(r.id)).length)+' unknown · excluded from active count'],['Running agent processes',String(freshRuns(runs).filter(r=>r.harness!=='PTY shell').length),'','Installed harnesses are not running agents']]).replaceAll(spark(),'');}
function deviceInspector(owner){const d=inventoryDevices.find(d=>d.id===chosenDevice);if(owner&&d.owner!=='alex'){chosenDevice=null;return ownerDevices();}return heading(owner?'My devices / '+d.name:'Users / device detail',d.name,`${d.kind} · ${d.os} · Last connected ${d.lastConnected}`,`<button data-back="device">${ico('arrow')} Back to ${owner?'my devices':'user'}</button>`)+inventoryTotals([d],deviceRuns(d.id))+card('Agents and sessions on this device',executionTable(deviceRuns(d.id),owner),chip(d.online?'Connected':'Offline',d.online?'':'neutral'))+`<div class="note" style="margin-top:20px">${d.online?'Source: synthetic native session observation. Model identity is separately reported where available.':'This host is offline. Last-known sessions may still run locally. Their current state is unknown; remote stop is unavailable.'}</div>`;}
function usersView(){if(chosenDevice)return deviceInspector(false);if(!chosenUser)return heading('Administration / people','People, devices, and native work.','Drill into a user to see their connected hosts, agents, harnesses, and model reporting.')+inventoryTotals(inventoryDevices,inventoryRuns)+card('User inventory',userTable(),'<span class="subtle">Sample cohort · 3 users</span>');const u=inventoryUsers.find(u=>u.id===chosenUser),ds=ownedDevices(u.id),rs=userRuns(u.id);return heading('Administration / user detail',u.name,u.email+' · Metadata view · Recording content requires separate audited access',`<button data-back="users">All users</button>`)+inventoryTotals(ds,rs)+`<div class="stack">${card('Connected and enrolled devices',deviceTable(ds),'<span class="subtle">Last connected ≠ last seen</span>')}${card('Where agents are running',executionTable(rs),'<span class="subtle">Harness / model / process / exact task state</span>')}</div>`;}
function ownerDevices(){if(chosenDevice)return deviceInspector(true);const ds=ownedDevices('alex'),rs=userRuns('alex');return heading('Your workspace / connected devices','Your devices. Your running agents.','See exactly where work is running, then stop a specific session when needed.')+inventoryTotals(ds,rs)+`<div class="stack">${card('Your enrolled devices',deviceTable(ds,true))}${card('Your agent and terminal sessions',executionTable(rs,true))}</div><div class="note" style="margin-top:20px">Stop session terminates the selected native session after confirmation. It does not revoke the device or stop its other sessions. All actions here are local simulations.</div>`;}
const unusualSignals=[{id:'sig_devices',title:'New device enrollment burst',who:'Sam Rivera',rule:'3 enrollments in 15 minutes; review threshold: more than 2.',evidence:'Sample window: 13:20–13:35 UTC. Includes retired devices, so the event count is not the current inventory count.',context:'A new build environment could explain this activity.',severity:'Review'}, {id:'sig_sessions',title:'Session starts above recent baseline',who:'Alex Lee',rule:'12 start events in 1 hour versus a sample baseline of 3 per hour.',evidence:'Sample baseline: previous 7 days, same hour; 6 valid days. Closed sessions remain part of start-event counts.',context:'Parallel testing can explain a spike. This signal does not establish misuse.',severity:'Review'},{id:'sig_stale',title:'Telemetry coverage is stale',who:'Morgan Chen',rule:'2 last-known sessions on an offline host. Live state is unconfirmed.',evidence:'gpu-workstation last seen Oct 30 at 16:44 UTC. No fresh native observation.',context:'A laptop, server maintenance, or a paused connector could explain missing telemetry.',severity:'Coverage'}];
function telemetryView(){const active=freshRuns(inventoryRuns),knownModel=active.filter(r=>r.harness!=='PTY shell'&&r.model).length,agentCount=active.filter(r=>r.harness!=='PTY shell').length,usageRuns=active.filter(r=>r.harness!=='PTY shell'&&Number.isFinite(r.tokens)),usageTotal=usageRuns.reduce((n,r)=>n+r.tokens,0);return heading('Administration / aggregate telemetry','Understand activity. Review the unusual.','Synthetic cohort · Snapshot 13:42:16 UTC · Events: last hour · No automatic enforcement')+inventoryTotals(inventoryDevices,inventoryRuns)+`<div class="two">${card('Harness and model distribution',`<div class="pad"><div class="distribution"><div><b>Codex CLI</b><span>${agentCount} confirmed running</span></div><div class="distribution-bar"><i style="width:${active.length?100*agentCount/active.length:0}%"></i></div><div><b>PTY shell</b><span>${active.filter(r=>r.harness==='PTY shell').length} confirmed running</span></div><div class="distribution-bar"><i style="width:${active.length?100*active.filter(r=>r.harness==='PTY shell').length/active.length:0}%"></i></div></div><div class="note">Model reporting: ${knownModel} of ${agentCount} running agent sessions. gpt-6.1: ${knownModel}. Not reported: ${agentCount-knownModel}. Terminal sessions have no model.</div></div>`)}${card('Telemetry coverage and runs',`<div class="pad"><div class="telemetry-run"><b>Native inventory observation</b>${chip('4 / 6 hosts current')}</div><p>Last sample 13:42:16 UTC · 2 hosts unknown</p><div class="telemetry-run"><b>Rule evaluation · eval_demo_13</b>${chip('Illustrative rules','neutral')}</div><p>3 review signals · Evaluated at 13:42:16 UTC</p><div class="telemetry-run"><b>Token usage reporting</b>${chip('Partial','warn')}</div><p>${usageTotal.toLocaleString('en-US')} reported tokens · ${usageRuns.length} of ${agentCount} active agent sessions report usage. This is a partial lifetime total, not fleet spend or a last-hour total.</p></div>`)}</div><div style="margin-top:20px">${card('Signals for human review',`<div class="signal-list">${unusualSignals.map(s=>`<article class="signal-review searchable"><div><div class="section-label">${s.who} · ${s.id}</div><h2>${s.title}</h2><p>${s.rule}</p><small>${s.evidence}</small></div><div>${chip(s.severity,s.severity==='Review'?'warn':'neutral')}<p>${s.context}</p><button data-signal="${s.id}">Inspect evidence</button></div></article>`).join('')}</div>`,chip('3 sample signals','warn'))}</div><div class="note" style="margin-top:20px">These are explainable review signals, not a claim of malicious activity. No automatic approval, revocation, or termination follows a signal. Sparse history must produce insufficient baseline.</div>`;}
navs.admin.splice(1,0,'Users');navs.admin.splice(3,0,'Telemetry & signals');
inbox=function(){return ownerDevices()+'<div style="margin-top:20px;max-width:420px">'+approval()+'</div>';};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&(b.dataset.page||b.dataset.persona||b.dataset.theme)){chosenDevice=null;chosenUser=null;}},true);
const inventoryOverview=adminOverview;
adminOverview=function(){return heading('Workspace / people and devices','Know who is running what, and where.','User inventory · Device presence · Agent execution · Explicit unknown states',`<button data-inventory-page="Users" class="primary">Explore users ${ico('arrow',12)}</button>`)+inventoryTotals(inventoryDevices,inventoryRuns)+`<div class="grid"><div class="stack">${card('People and connected devices',userTable(),'<button data-inventory-page="Users">View all users</button>')}${card('Agent execution inventory',executionTable(inventoryRuns.filter(r=>r.harness!=='PTY shell')))}</div><div class="stack">${card('Activity review',`<div class="pad"><div class="eyebrow">Sample signals</div><h1 style="font-size:34px;margin:14px 0">03</h1><h3>Changes worth a closer look.</h3><p>Enrollment burst, session-start spike, and stale observation coverage.</p><button data-inventory-page="Telemetry & signals" style="margin-top:15px">Review telemetry ${ico('arrow',12)}</button></div>`)}${needs()}<div class="note">This cohort is synthetic. Model details are reported for some agent sessions and unknown for others.</div></div></div>`;};
const showActionBeforeInventory=openAction;
openAction=function(kind){showActionBeforeInventory(kind);document.querySelector('#stop-result-field')?.remove();};
function showStop(id){const r=inventoryRuns.find(r=>r.id===id),d=inventoryDevices.find(d=>d.id===r?.device);if(persona!=='user'||d?.owner!=='alex'||!d.online||runState(r)!=='Running'){notify('No permitted stop action for this session.');return}action='stop:'+id;$('#dialog-title').textContent='Stop this session?';$('#dialog-copy').textContent=`${r.name} · ${d.name} · ${r.id}. This ends this native session and may discard in-progress work. Other sessions and device access continue.`;$('#reason-label').textContent='Optional note';$('#reason').required=false;$('#reason').value='';$('#confirmation-label').textContent='Type STOP to confirm session termination';$('#confirmation-label').classList.remove('hide');$('#confirmation').classList.remove('hide');$('#confirmation').value='';$('#confirmation').required=true;$('#confirmation').pattern='STOP';document.querySelector('#stop-result-field')?.remove();$('#confirmation').insertAdjacentHTML('afterend','<div id="stop-result-field"><label for="stop-result">Prototype response scenario</label><select id="stop-result"><option value="confirmed">Native termination confirmed</option><option value="unknown">Reply lost · outcome unknown</option></select></div>');$('#submit-action').textContent='Simulate stop';$('#action-dialog').showModal();}
const priorSubmit=$('#action-form').onsubmit;
$('#action-form').onsubmit=function(e){if(action.startsWith('stop:')){e.preventDefault();const id=action.slice(5);if($('#confirmation').value!=='STOP')return;const unknown=$('#stop-result').value==='unknown';if(unknown)unknownStops.add(id);else stoppedRuns.add(id);$('#action-dialog').close();render();notify(unknown?'Simulation: stop outcome unknown. Refresh original session state; do not send a new stop.':'Simulation: native termination confirmed. Other sessions remain running.');return}priorSubmit(e)};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.user){chosenUser=b.dataset.user;chosenDevice=null;page='Users';render()}else if(b.dataset.device){const d=inventoryDevices.find(d=>d.id===b.dataset.device);if(persona==='user'&&d.owner!=='alex')return;chosenDevice=d.id;if(persona==='admin')chosenUser=d.owner;render()}else if(b.dataset.back){if(b.dataset.back==='users')chosenUser=null;chosenDevice=null;render()}else if(b.dataset.inventoryPage){page=b.dataset.inventoryPage;chosenDevice=null;chosenUser=null;render()}else if(b.dataset.reconcile){if(persona==='user'&&unknownStops.has(b.dataset.reconcile))notify('Simulation: read-only reconciliation. Native outcome is still unknown; no stop was resent.');}else if(b.dataset.stop){showStop(b.dataset.stop)}else if(b.dataset.signal){const s=unusualSignals.find(s=>s.id===b.dataset.signal);action='signal';$('#dialog-title').textContent=s.title;$('#dialog-copy').textContent=s.rule+' '+s.evidence+' '+s.context;$('#reason').required=false;$('#reason').value='';$('#reason-label').textContent='Optional local review note';$('#confirmation').required=false;$('#confirmation').classList.add('hide');$('#confirmation-label').classList.add('hide');document.querySelector('#stop-result-field')?.remove();$('#submit-action').textContent='Close review';$('#action-dialog').showModal();}});

render=function(){firstRender();
 $('#themes').innerHTML=[['workspace','01','Studio'],['ops','02','Signal'],['govern','03','Atlas']].map(([id,n,t])=>`<button data-theme="${id}" class="${id===theme?'active':''}">${n} &nbsp; ${t}</button>`).join('');
 const navIcons={'Overview':'grid','Users':'users','Fleet':'fleet','Telemetry & signals':'chart','Audit & investigations':'file','Policies':'shield','System health':'activity','Work inbox':'grid','My machines':'fleet','Session history':'file','Launch profiles':'layers'};

 if(!document.querySelector('.workspace-picker'))$('.brand').insertAdjacentHTML('afterend',`<div class="workspace-picker"><span class="square">Q</span><span>Engineering<small>Development environment</small></span><span style="margin-left:auto;color:#90919b">⌄</span></div>`);
 $('#search-open').innerHTML=ico('search',12)+' Search workspace <span>⌘ K</span>';
 if(!document.querySelector('.topbar-actions')){const search=$('#search-open');const holder=document.createElement('div');holder.className='topbar-actions';search.replaceWith(holder);holder.append(search);holder.insertAdjacentHTML('beforeend','<span class="data-badge"><i></i>Synthetic preview</span><span class="topbar-profile">AL</span>');}
 let newContent=null;if(persona==='admin'&&page==='Users')newContent=usersView();else if(persona==='admin'&&page==='Telemetry & signals')newContent=telemetryView();else if(persona==='user'&&page==='My machines')newContent=ownerDevices();
 else if(persona==='admin'&&page==='Fleet')newContent=heading('Administration / all devices','Every device, with its execution context.','Server counts are a subset of enrolled devices. Freshness determines what is known.')+card('Enrolled device inventory',deviceTable(inventoryDevices));
 if(newContent)$('#content').innerHTML=newContent+'<div class="bottom"><span>Synthetic data · Snapshot 13:42:16 UTC</span><span>'+ (persona==='admin'?'Metadata does not grant native control':'Owner actions require current authorization')+'</span></div>';
 if($('#submit-action').textContent==='Simulate stop'&&!action.startsWith('stop:'))$('#submit-action').textContent='Simulate action';
};
