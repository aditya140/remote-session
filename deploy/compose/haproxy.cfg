global
    log stdout format raw local0
    maxconn 4096
    hard-stop-after 60s
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 65s
    timeout server 65s
    timeout http-request 10s
    timeout http-keep-alive 15s
    timeout tunnel 10m

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend remote_edge
    # Browser callback URLs carry one-time codes. Never place them in access logs.
    no log
    bind :8443 ssl crt /run/qgr/server.pem
    # Health, metrics and unauthenticated process administration are private.
    http-request deny deny_status 404 if { path_beg /metrics /live /ready }
    http-request set-header X-Forwarded-Proto https
    default_backend remote_nodes

backend remote_nodes
    # Affinity is a disposable load hint. Gateways authenticate every connection
    # independently; a bearer value is never captured in access logs.
    balance hdr(authorization)
    hash-type consistent
    option httpchk GET /ready
    http-check expect status 200
    server gateway-1 gateway-1:8080 check port 9091 inter 2s fall 2 rise 2 resolvers docker init-addr none
    server gateway-2 gateway-2:8080 check port 9091 inter 2s fall 2 rise 2 resolvers docker init-addr none
    server gateway-3 gateway-3:8080 check port 9091 inter 2s fall 2 rise 2 resolvers docker init-addr none
    server gateway-4 gateway-4:8080 check port 9091 inter 2s fall 2 rise 2 resolvers docker init-addr none
