frontend keycloak_edge
    bind :9443 ssl crt /run/qgr/server.pem
    # OAuth URLs contain codes and state. Do not put them in access logs.
    no log
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    use_backend keycloak_directory if { path_beg /v1.0/ }
    default_backend keycloak_server

backend keycloak_server
    server keycloak keycloak:8080 resolvers docker init-addr none

backend keycloak_directory
    server directory directory:8080 resolvers docker init-addr none
