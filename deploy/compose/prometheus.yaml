global:
  scrape_interval: 15s
  scrape_timeout: 4s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: qgenie-remote-gateway
    static_configs:
      - targets: [gateway-1:9091, gateway-2:9091, gateway-3:9091, gateway-4:9091]
  - job_name: qgenie-remote-development-probe
    static_configs:
      - targets: [otel:8889]
