# Only the explicit development profile publishes this additional loopback port.
# The identity binary and known synthetic key are absent from the gateway image.
frontend fixture_identity_edge
    bind :9443 ssl crt /run/qgr/server.pem
    default_backend fixture_identity

backend fixture_identity
    option httpchk GET /live
    server fixture fixture-identity:8080 check inter 2s resolvers docker init-addr none
